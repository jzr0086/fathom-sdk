[project]
name = "fathom-sdk"
version = "0.1.0"
description = "SDK for building Fathom code review agents — base interfaces, data models, and context utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fathom Team" }]

dependencies = [
    "pydantic>=2.0,<3.0",
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-python>=0.23,<1.0",
    "tree-sitter-javascript>=0.23,<1.0",
    "tree-sitter-typescript>=0.23,<1.0",
    "tree-sitter-java>=0.23,<1.0",
    "tree-sitter-go>=0.23,<1.0",
    "networkx>=3.0,<4.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40,<1.0",
]
ml = [
    "transformers>=4.40,<5.0",
    "sentence-transformers>=3.0,<4.0",
    "torch>=2.0,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]

[project.entry-points."fathom.agents"]
# Agents register themselves here for auto-discovery

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_sdk", "agents", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests", "agents"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "conformance: agent conformance tests",
    "benchmark: benchmark tests against labeled datasets",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
