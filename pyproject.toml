[project]
name = "fathom-sdk"
version = "0.1.0"
description = "SDK for building Fathom code review agents — base interfaces, data models, and context utilities"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Fathom Team" }]

dependencies = [
    "pydantic>=2.0,<3.0",
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-python>=0.23,<1.0",
    "tree-sitter-javascript>=0.23,<1.0",
    "tree-sitter-typescript>=0.23,<1.0",
    "tree-sitter-java>=0.23,<1.0",
    "tree-sitter-go>=0.23,<1.0",
    "networkx>=3.0,<4.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40,<1.0",
]
ml = [
    "transformers>=4.40,<5.0",
    "sentence-transformers>=3.0,<4.0",
    "torch>=2.0,<3.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]

[project.entry-points."fathom.agents"]
# Batch 1 — Code Quality + Performance
long_method = "agents.cluster_07_code_quality.long_method.agent:LongMethodAgent"
cyclomatic_complexity = "agents.cluster_07_code_quality.cyclomatic_complexity.agent:CyclomaticComplexityAgent"
cognitive_complexity = "agents.cluster_07_code_quality.cognitive_complexity.agent:CognitiveComplexityAgent"
nested_loop_complexity = "agents.cluster_05_performance.nested_loop_complexity.agent:NestedLoopComplexityAgent"
# Batch 2 — Security + Exception Swallowing
exception_swallowing = "agents.cluster_03_bug_detection.exception_swallowing.agent:ExceptionSwallowingAgent"
weak_cipher_hash = "agents.cluster_04_security.weak_cipher_hash.agent:WeakCipherHashAgent"
insecure_randomness = "agents.cluster_04_security.insecure_randomness.agent:InsecureRandomnessAgent"
hardcoded_secrets = "agents.cluster_04_security.hardcoded_secrets.agent:HardcodedSecretsAgent"
# Batch 3 — Security Data Flow + Bug Detection
sql_injection = "agents.cluster_04_security.sql_injection.agent:SqlInjectionAgent"
xss_pattern = "agents.cluster_04_security.xss_pattern.agent:XssPatternAgent"
blocking_io_async = "agents.cluster_05_performance.blocking_io_async.agent:BlockingIoAsyncAgent"
off_by_one = "agents.cluster_03_bug_detection.off_by_one.agent:OffByOneAgent"
# Batch 4 — Performance + Analysis
n_plus_one_query = "agents.cluster_05_performance.n_plus_one_query.agent:NPlusOneQueryAgent"
unnecessary_recomputation = "agents.cluster_05_performance.unnecessary_recomputation.agent:UnnecessaryRecomputationAgent"
dead_code_reachability = "agents.cluster_01_static_analysis.dead_code_reachability.agent:DeadCodeReachabilityAgent"
duplicate_code = "agents.cluster_02_semantic_understanding.duplicate_code.agent:DuplicateCodeAgent"
# Batch 5 — Advanced Data Flow + Critical
null_dereference = "agents.cluster_03_bug_detection.null_dereference.agent:NullDereferenceAgent"
resource_leak = "agents.cluster_03_bug_detection.resource_leak.agent:ResourceLeakAgent"
race_condition = "agents.cluster_03_bug_detection.race_condition.agent:RaceConditionAgent"
gc_pressure = "agents.cluster_05_performance.gc_pressure.agent:GcPressureAgent"
# Phase 2 — Batch 1: Code Quality + Architecture
magic_number = "agents.cluster_07_code_quality.magic_number.agent:MagicNumberAgent"
solid_violations = "agents.cluster_06_architecture.solid_violations.agent:SolidViolationsAgent"
circular_dependency = "agents.cluster_06_architecture.circular_dependency.agent:CircularDependencyAgent"
layer_violation = "agents.cluster_06_architecture.layer_violation.agent:LayerViolationAgent"
assertion_quality = "agents.cluster_08_testing.assertion_quality.agent:AssertionQualityAgent"
# Phase 2 — Batch 2: Security Expansion
path_traversal = "agents.cluster_04_security.path_traversal.agent:PathTraversalAgent"
command_injection = "agents.cluster_04_security.command_injection.agent:CommandInjectionAgent"
ssrf = "agents.cluster_04_security.ssrf.agent:SsrfAgent"
deserialization = "agents.cluster_04_security.deserialization.agent:DeserializationAgent"
auth_bypass = "agents.cluster_04_security.auth_bypass.agent:AuthBypassAgent"
# Phase 2 — Batch 3: Bug Detection Expansion
integer_overflow = "agents.cluster_03_bug_detection.integer_overflow.agent:IntegerOverflowAgent"
infinite_loop = "agents.cluster_03_bug_detection.infinite_loop.agent:InfiniteLoopAgent"
uninitialized_variable = "agents.cluster_03_bug_detection.uninitialized_variable.agent:UninitializedVariableAgent"
type_confusion = "agents.cluster_03_bug_detection.type_confusion.agent:TypeConfusionAgent"
# Phase 2 — Batch 4: Testing + Git + Performance
test_coverage_gap = "agents.cluster_08_testing.test_coverage_gap.agent:TestCoverageGapAgent"
test_smell = "agents.cluster_08_testing.test_smell.agent:TestSmellAgent"
hotspot = "agents.cluster_09_git_intelligence.hotspot.agent:HotspotAgent"
co_change_miner = "agents.cluster_09_git_intelligence.co_change_miner.agent:CoChangeMinerAgent"
memory_alloc_hotspot = "agents.cluster_05_performance.memory_alloc_hotspot.agent:MemoryAllocHotspotAgent"
ast_pattern_matching = "agents.cluster_01_static_analysis.ast_pattern_matching.agent:AstPatternMatchingAgent"
# Phase 2 — Batch 5: Static Analysis + Semantic
token_sequence = "agents.cluster_01_static_analysis.token_sequence.agent:TokenSequenceAgent"
semantic_clone = "agents.cluster_02_semantic_understanding.semantic_clone.agent:SemanticCloneAgent"
# Phase 2 — Batch 6: Language-Specific Deep
python_type_annotation = "agents.cluster_10_language_specific.python_type_annotation.agent:PythonTypeAnnotationAgent"
js_async_await = "agents.cluster_10_language_specific.js_async_await.agent:JsAsyncAwaitAgent"
ts_type_safety = "agents.cluster_10_language_specific.ts_type_safety.agent:TsTypeSafetyAgent"
java_concurrency = "agents.cluster_10_language_specific.java_concurrency.agent:JavaConcurrencyAgent"
go_goroutine_safety = "agents.cluster_10_language_specific.go_goroutine_safety.agent:GoGoroutineSafetyAgent"
# Phase 2 — Batch 7: LLM + Taint Flow
review_generator = "agents.cluster_11_llm_generative.review_generator.agent:ReviewGeneratorAgent"
fix_suggestion = "agents.cluster_11_llm_generative.fix_suggestion.agent:FixSuggestionAgent"
taint_flow_analyzer = "agents.cluster_13_graph_relational.taint_flow_analyzer.agent:TaintFlowAnalyzerAgent"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_sdk", "agents", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests", "agents"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "conformance: agent conformance tests",
    "benchmark: benchmark tests against labeled datasets",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
